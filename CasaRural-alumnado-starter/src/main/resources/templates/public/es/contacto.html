<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/public/es/head :: head('Contacto - Casa Rural', 'contacto')}"></head>

<body>
<header th:replace="~{fragments/public/es/header :: header}"></header>

<main>
    <section class="pagina-titulo">
        <h2>Contacto</h2>
        <p>Estaremos encantados de ayudarte</p>
    </section>



    <section class="contenido">
        <p><strong>Dirección:</strong> Asturias, España</p>
        <p><strong>Teléfono:</strong> <a href="tel:+34600000000">+34 123 123 123</a></p>
        <p><strong>Email:</strong> info@casarrural.com</p>
        <hr>
    </section>
    <div th:if="${mensajeEnviado}" class="mensaje-exito">
        ¡Mensaje enviado con éxito! Nos pondremos en contacto pronto.
    </div>
    <form th:action="@{/contacto}" method="post" class="formulario-contacto">
        <div class="campo">
            <label for="nombre" class="etiqueta">Nombre *</label>
            <input type="text" id="nombre" name="nombre" required class="input">
        </div>
        <div class="campo">
            <label for="email" class="etiqueta">Email *</label>
            <input type="email" id="email" name="email" required class="input">
        </div>
        <div class="campo">
            <label for="telefono" class="etiqueta">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" class="input">
        </div>
        <div class="campo campo--mensaje">
            <label for="mensaje" class="etiqueta">Mensaje *</label>
            <textarea id="mensaje" name="mensaje" rows="5" required class="input textarea"></textarea>
        </div>
        <button type="submit" class="btn">Enviar mensaje</button>
    </form>
</main>
</body>
</html>
