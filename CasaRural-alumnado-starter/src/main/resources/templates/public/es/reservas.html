<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/public/es/head :: head('Reservas - Casa Rural','reservas')}">
    <meta charset="UTF-8">
    <title>Reservas</title>
</head>

<body>
<header th:replace="~{fragments/public/es/header :: header}"></header>

<main class="container" style="margin-top: 100px; min-height: 70vh;">

    <div class="content">
        <h1 style="text-align: center; margin-bottom: 20px;">Reserva tu estancia</h1>

        <div th:if="${error}" style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p th:text="${error}"></p>
        </div>
        <div th:if="${mensaje}" style="background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p th:text="${mensaje}"></p>
        </div>

        <div th:replace="~{admin/reservas/formulario :: form-reserva(@{/reservas/guardar})}">
        </div>
    </div>

</main>

<footer th:replace="~{fragments/public/es/footer :: footer}"></footer>
</body>
</html>
