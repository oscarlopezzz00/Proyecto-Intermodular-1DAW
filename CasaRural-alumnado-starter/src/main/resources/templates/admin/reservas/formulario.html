<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${reserva.id == null ? 'Nueva reserva' : 'Editar reserva'}">
        Formulario reserva
    </title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="layout">

    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main">

        <div class="header">
            <div>
                <p>Panel de administración</p>
                <h2 th:text="${reserva.id == null ? 'Nueva reserva' : 'Editar reserva'}">
                    Formulario
                </h2>
            </div>
        </div>

        <div class="content">

            <div th:if="${error}" style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #f5c6cb;">
                <p th:text="${error}" style="margin: 0;"></p>
            </div>
            <div th:if="${mensaje}" style="background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb;">
                <p th:text="${mensaje}" style="margin: 0;"></p>
            </div>

            <div class="card form-card" th:fragment="form-reserva(actionUrl)">

                <form th:action="${actionUrl != null} ? ${actionUrl} : (${reserva.id == null} ? @{/admin/reservas/guardar} : @{/admin/reservas/actualizar})"
                      method="post">

                    <input type="hidden" name="id" th:value="${reserva.id}">

                    <div class="form-group">
                        <label for="nombreCliente">Nombre del cliente</label>

                        <input type="text"
                               id="nombreCliente"
                               name="nombreCliente"
                               th:value="${reserva.nombreCliente}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>

                        <input type="text"
                               id="telefono"
                               name="telefono"
                               th:value="${reserva.telefono}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="fechaInicio">Fecha de inicio</label>

                        <input type="date"
                               id="fechaInicio"
                               name="fechaInicio"
                               th:value="${reserva.fechaInicio}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="fechaFin">Fecha de fin</label>

                        <input type="date"
                               id="fechaFin"
                               name="fechaFin"
                               th:value="${reserva.fechaFin}"
                               required>
                    </div>

                    <div class="form-actions">

                        <a th:href="@{/admin/reservas}" class="btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn">
                            <span th:text="${reserva.id == null ? 'Guardar reserva' : 'Actualizar reserva'}">
                                Guardar
                            </span>
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
